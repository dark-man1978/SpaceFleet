name: Validate and optionally publish Steam Deck release

on:
  push:
    branches: [main, upgrade/godot-4.7]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: New release tag
        required: true
        default: v0.4.0
        type: string

permissions:
  contents: read

concurrency:
  group: space-fleet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    env:
      GODOT_VERSION: 4.7.2
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Check release
        if: github.event_name == 'workflow_dispatch'
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git check-ref-format "refs/tags/$TAG"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Godot .NET and Linux export templates
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          echo '129f82db7bafd54ae14bb5bb284041c73860e8c7a009a3a026ca5e946cbff247  '"$RUNNER_TEMP/godot.zip" | sha256sum --check
          echo '92f8681e349ef1f90891b792da95e3b2b0bd1ed610b78018c58feb2d87e15a9d  '"$RUNNER_TEMP/templates.tpz" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono"
          mkdir -p "$templates"
          unzip -j -q "$RUNNER_TEMP/templates.tpz" 'templates/linux_release.x86_64' 'templates/linux_debug.x86_64' -d "$templates"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" >> "$GITHUB_ENV"
      - name: Build and test C# project
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/check_fleet_assets.py
          dotnet build SpaceFleet.csproj
          "$GODOT_BIN" --headless --path . --editor --import --quit
          "$GODOT_BIN" --headless --path . --quit-after 600 -- --self-test | tee "$RUNNER_TEMP/self-test.log"
          grep -q 'SELF TEST PASS:' "$RUNNER_TEMP/self-test.log"
      - name: Export and test Linux executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          "$GODOT_BIN" --headless --path . --export-release 'Steam Deck'
          ./build/SpaceFleet.x86_64 --headless --quit-after 600 -- --self-test | tee "$RUNNER_TEMP/export-test.log"
          grep -q 'SELF TEST PASS:' "$RUNNER_TEMP/export-test.log"
      - name: Package and publish
        if: github.event_name == 'workflow_dispatch' && steps.release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/SpaceFleet
          cp -a build/. dist/SpaceFleet/
          cp LICENSE README.md VALIDATION.md dist/SpaceFleet/
          cp -a Licenses dist/SpaceFleet/
          cat docs/videos/SpaceFleet-0.3-Demo.mp4.part* > dist/SpaceFleet-0.3-Demo.mp4
          echo 'da2d110d7ead5db84887796b87400060eb7b6340cb5f6681de2d78223d867169  dist/SpaceFleet-0.3-Demo.mp4' | sha256sum --check
          cd dist
          zip -q -r SpaceFleet-SteamDeck-Spiel.zip SpaceFleet
          sha256sum SpaceFleet-SteamDeck-Spiel.zip SpaceFleet-0.3-Demo.mp4 > SHA256SUMS.txt
          gh release create "$TAG" SpaceFleet-SteamDeck-Spiel.zip SpaceFleet-0.3-Demo.mp4 SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Space Fleet $TAG" --notes 'Steam Deck / SteamOS Linux x86_64 build. Includes the .NET runtime. Extract the entire archive, add SpaceFleet.x86_64 to Steam as a non-Steam game, use the Gamepad layout, and leave Proton disabled. AI-generated Godot C# prototype with complete Fleet A ship models, released under MIT. Includes a demo video made from real engine captures. Third-party notices are included.'
